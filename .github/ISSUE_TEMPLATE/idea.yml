name: Idea
description: A feature or enhancement proposal.
title: "<short summary of the idea>"
labels: ["type:idea"]
body:
  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: What would you like to be able to do?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why it's worth it
      description: What value does it add? Who benefits?
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: Likely area
      options:
        - sources
        - sync
        - api
        - models
        - export
        - superapp
        - infra
        - other
    validations:
      required: false
