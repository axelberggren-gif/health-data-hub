version: 2
updates:
  # Python runtime + dev dependencies.
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3   # one at a time-ish; avoids a flood for a solo owner
    commit-message:
      prefix: chore
      include: scope
    labels:
      - "type:chore"
      - "area:infra"

  # GitHub Actions — keeps the SHA-pinned actions fresh via reviewable PRs.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    commit-message:
      prefix: ci
    labels:
      - "type:chore"
      - "area:infra"
