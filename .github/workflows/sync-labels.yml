name: sync-labels

# Keeps the repo's labels in sync with .github/labels.yml (the source of truth).
# Runs when labels.yml changes on main, or on manual dispatch.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/labels.yml"
      - ".github/workflows/sync-labels.yml"

permissions:
  issues: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # SHA-pinned (supply-chain safety); comment tracks the human-readable version.
      - uses: crazy-max/ghaction-github-labeler@548a7c3603594ec17c819e1239f281a3b801ab4d # v6.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          yaml-file: .github/labels.yml
          skip-delete: true   # never delete labels not listed here
          dry-run: false
