name: pr-title-lint

# Enforces Conventional-Commit PR titles. The squash-merge uses the PR title as the
# commit message on main, so the title must be well-formed. Required check (context: `lint`).
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches: [main]

permissions:
  pull-requests: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      # SHA-pinned (supply-chain safety); comment tracks the human-readable version.
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            chore
            docs
            refactor
            perf
            ci
            test
            revert
            style
          requireScope: false
          subjectPattern: ^[a-z].+
          subjectPatternError: |
            The PR title must look like `feat: add oura source` or
            `fix(sync): handle empty cursor` — a type, optional (scope), a colon,
            then a lowercase summary. Allowed types: feat, fix, chore, docs,
            refactor, perf, ci, test, revert, style.
