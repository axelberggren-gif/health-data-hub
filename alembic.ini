# Alembic configuration — schema migrations for the canonical store.
#
# The database URL is intentionally NOT set here: `alembic/env.py` reads it from the
# app's Settings (env / .env), so migrations always target the same database as the app
# and no connection string is ever committed to this public repo. Callers that need a
# different target (the test suite, the CI replay check) override it explicitly.
#
# Usage: `make migrate` (upgrade to head) · `make migration m="add x"` (autogenerate).

[alembic]
script_location = alembic
# `.` so `env.py` can `import app`; path_separator silences Alembic's legacy-split warning.
prepend_sys_path = .
path_separator = os
# Revision filenames: 0001_add_x.py, 0002_… — ordered and readable in a directory listing.
file_template = %%(rev)s_%%(slug)s
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
